; VoiceLink — I2S microphone bench
;
; Two build targets share one board profile:
;   mic_test   live level meter, for proving the wiring is good
;   recorder   captures N seconds into PSRAM and dumps it over USB
;
; Build/upload:
;   pio run -e mic_test -t upload && pio device monitor -e mic_test
;   pio run -e recorder -t upload      (then run record.py — close the monitor first)

[platformio]
default_envs = mic_test

; ===========================================================================
;  PICK YOUR BOARD AND MIC — edit the two lines in [active] only.
;
;  Currently set to the WROVER. Both board profiles are kept because this
;  project uses both boards; switch [active] to ${s3.*} when you move over.
;
;  The mic flags below are only the STARTING values — mic_test lets you change
;  the bit shift ('b') and the SPH0645 timing fix ('s') live over serial, so
;  you can find the working combination without reflashing. Copy whatever works
;  back into [active] before building the recorder.
;
;  Board and mic are NOT interchangeable:
;    - On the classic ESP32 the camera driver owns I2S port 0, so the mic must
;      run on port 1. On the S3 the camera uses LCD_CAM instead, so port 0 is
;      free — and GPIO 33-37 are taken by OPI PSRAM, which is why the S3 cannot
;      reuse the WROVER's pins. GPIO 42 does not exist at all on classic ESP32.
; ===========================================================================

[active]
board = ${s3.board}
flags = ${s3.flags} ${sph0645.flags}

; --- Boards: pins and I2S port ---------------------------------------------

; Pins 32/14/33 are clear of the standard Freenove WROVER camera map
; (4,5,18,19,21,22,23,25,26,27,34,35,36,39).
; If `freenove_esp32_wrover` fails to resolve, use board = esp32dev instead.
[wrover]
board = freenove_esp32_wrover
flags =
  -DBOARD_HAS_PSRAM
  -DMIC_WS_PIN=32
  -DMIC_SCK_PIN=14
  -DMIC_SD_PIN=33
  -DMIC_I2S_PORT=1

; Matches firmware/voicelink_capture/voicelink_capture.ino.
; ARDUINO_USB_MODE=1 is the hwcdc (USB-Serial-JTAG) path. Without it Serial
; routes to the UART0 pins and never reaches /dev/cu.usbmodem; with TinyUSB
; instead, the board re-enumerates at app start and the boot banner is lost.
[s3]
board = esp32-s3-devkitc-1
flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DMIC_WS_PIN=2
  -DMIC_SCK_PIN=1
  -DMIC_SD_PIN=42
  -DMIC_I2S_PORT=0
  ; Second ground for the mic's SEL pin, since the board breaks out only one
  ; GND. Delete this line if you wire SEL to a real GND instead.
  -DMIC_SEL_GND_PIN=14

; --- Mics: sample scaling and part-specific quirks --------------------------

; 18 data bits, large DC bias, and on the classic ESP32 it needs a register
; timing fix that the code applies when MIC_SPH0645 is defined.
[sph0645]
flags =
  -DMIC_SHIFT=14
  -DMIC_SPH0645=1

; 24 data bits left-justified in a 32-bit slot; no quirks.
; Also the right profile for the Adafruit ICS-43434 — same standard I2S
; framing and the same 24-in-32 packing, so nothing changes.
[inmp441]
flags =
  -DMIC_SHIFT=16

; ===========================================================================

[env:mic_test]
platform = espressif32
framework = arduino
board = ${active.board}
build_flags = ${active.flags}
build_src_filter = +<mic_test.cpp>
monitor_speed = 115200
upload_speed = 460800

[env:recorder]
platform = espressif32
framework = arduino
board = ${active.board}
build_flags = ${active.flags}
build_src_filter = +<recorder.cpp>
monitor_speed = 921600
upload_speed = 460800
