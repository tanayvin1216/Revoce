# Phase-4 distillation v2 — all hyperparameters live here (CLAUDE.md §6: no
# inline hyperparams). The config is hashed and the hash logged on every train
# run; identical hashes mean identical configuration.

seed: 0

# Student architecture — STANDARD LAYERS ONLY so it exports cleanly to
# ONNX / OpenVINO (LayerNorm + Linear + ReLU + Dropout; all in opset 17).
model:
  context_dim: 769        # v2.2 richer input: scene(384) + transcript(384) + is_question(1)
  hidden_dim: 192
  dropout: 0.3
  # v3 bi-encoder only: the shared latent space both towers project into. The
  # score is a dot product in this space, so proj_dim is the entire capacity of
  # the context/phrase interaction.
  proj_dim: 128

# Vocabulary — the DYNAMIC candidate set (core excluded). An item must appear
# at least min_freq times in teacher boards to be kept. dedup_tau: after
# frequency ranking, single-link clusters at MiniLM cosine >= tau collapse to
# their highest-frequency member (RC-2 hedge-wall fix); dropped variants map to
# the kept representative in canonical.json.
vocab:
  min_freq: 3
  max_size: 200
  dedup_tau: 0.80
  # v3 bi-encoder only. The bank has no frequency floor, so it is ~1350 phrases
  # against the v2 vocab's 116 — and at that size SINGLE-link clustering (what
  # dedup_vocab uses) chains badly. Swept linkage x tau on the real corpus
  # (341 rows, 1358 distinct phrases, 14 hedge variants):
  #
  #   linkage    0.80   0.85   0.88   0.90
  #   single     FAIL   FAIL   FAIL   FAIL      (13 / 6 / 3 / 2 oversized)
  #   average    FAIL   FAIL   FAIL   ok
  #   complete   FAIL   ok     ok     ok
  #
  # Single-link fails at EVERY tau, so raising tau is a treadmill, not a fix.
  # Complete linkage requires every member of a cluster to be mutually similar,
  # so chaining cannot happen by construction and the setting stays valid as the
  # bank grows. 0.85 is the lowest tau it passes at, and it collapses the hedge
  # cluster hardest there (14 variants -> 7, vs 8 for average@0.90).
  bank_dedup_tau: 0.85
  bank_linkage: complete

# Training
train:
  epochs: 60
  batch_size: 32
  lr: 0.001
  weight_decay: 1.0e-3
  val_frac: 0.15
  test_frac: 0.15
  patience: 15            # early-stop patience (epochs without val improvement)
  # v3 bi-encoder only: random negatives added to each batch's candidate set on
  # top of the in-batch positives. The in-batch half supplies the hard negatives
  # (phrases the teacher really chose, for a different situation); these keep the
  # model from only ever seeing plausible candidates.
  n_random_negatives: 128

# Board / metric window (mirrors Phase 3)
board:
  k: 10                   # full board the device shows (4 core + k_dyn dynamic)
  k_dyn: 6               # dynamic slots the student fills
  metric_k: 7             # the window the Phase-3 metrics judge
  pool_mult: 3            # infer.py MMR pool size = pool_mult * k_dyn

# v3 bi-encoder selection. Swept on the VALIDATION split only; the test split
# was scored once, after these were fixed.
#
# The diagnostic that drove this: of 20 held-out coverage misses, 19 had a
# satisfying phrase already inside the top-18 pool. So the model's ranking was
# fine and MMR was discarding the right answer — because mmr_select scored
# relevance as cosine-to-situation and ignored the bi-encoder's own scores
# entirely once the pool was cut.
#
#   rel_source  lam  pool | cov_dyn  ratio    df     sfp   gates (val)
#   cosine      0.6    3   |  0.750   0.871  4.405  0.1587  fail/fail
#   model       0.6    6   |  0.736   0.855  4.690  0.1389  PASS/fail
#   blend       0.6    6   |  0.792   0.920  4.655  0.1423  PASS/PASS
#   blend       0.75   6   |  0.806   0.936  4.643  0.1440  fail/PASS
#
# model-only relevance gives the best diversity of anything measured but does
# not recover coverage; cosine-only recovers neither. The blend is the only
# setting that passes both gates.
selection_v3:
  lam: 0.6
  pool_mult: 6
  rel_source: blend       # cosine | model | blend
