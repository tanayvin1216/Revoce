<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>VoiceLink — AAC board (placeholder)</title>
  <!--
    PLACEHOLDER AAC board. This will be replaced by the real designed board.
    It never calls a model — it only talks to the server over the WebSocket.
    The page is served over PLAIN HTTP, so ws:// is not blocked as mixed content.
  -->
  <style>
    :root {
      --bg: #f4f2ee;
      --surface: #ffffff;
      --ink: #1c1b19;
      --muted: #8a857c;
      --line: #e2ded6;
      --accent: #2f6f5e;
      --down: #b4452f;
      --tap: #f2c14e;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column; height: 100vh; height: 100dvh;
    }
    header {
      display: flex; align-items: baseline; gap: 12px;
      padding: 14px 20px; border-bottom: 1px solid var(--line);
    }
    header h1 { font-size: 15px; font-weight: 700; letter-spacing: .02em; margin: 0; }
    header .tag { font-size: 12px; color: var(--muted); }
    header .status { margin-left: auto; font-size: 12px; color: var(--muted); }
    header .status.live b { color: var(--accent); }
    header .status.down b { color: var(--down); }
    main {
      flex: 1; overflow-y: auto; padding: 18px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px; align-content: start;
    }
    button.word {
      appearance: none; border: 1px solid var(--line);
      background: var(--surface); color: var(--ink); border-radius: 14px;
      padding: 18px 12px; min-height: 132px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      cursor: pointer; transition: transform 80ms ease, background 120ms ease, border-color 120ms ease;
    }
    button.word .sym { font-size: 44px; line-height: 1; }
    button.word .lbl { font-size: 20px; font-weight: 600; text-align: center; }
    button.word:active { transform: scale(.97); }
    button.word.flash { background: var(--tap); border-color: var(--tap); }
    footer { padding: 8px 20px 14px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <header>
    <h1>VoiceLink</h1>
    <span class="tag">AAC board · placeholder UI · stub vocabulary</span>
    <span class="status down" id="status">connecting…</span>
  </header>
  <main id="board" aria-label="vocabulary"></main>
  <footer id="foot">no board yet</footer>

  <script>
    // Same-origin WebSocket. Never call a model here — only talk to the server,
    // which owns the seam (rank_vocabulary).
    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const footEl = document.getElementById("foot");
    let currentBoardId = null;
    let ws = null;
    let reconnectDelay = 500;

    function setStatus(live, html) {
      statusEl.className = "status " + (live ? "live" : "down");
      statusEl.innerHTML = html;
    }

    function render(items) {
      boardEl.innerHTML = "";
      for (const it of items) {
        const b = document.createElement("button");
        b.className = "word";
        const sym = document.createElement("span");
        sym.className = "sym";
        sym.textContent = it.symbol || "▢";
        const lbl = document.createElement("span");
        lbl.className = "lbl";
        lbl.textContent = it.word;
        b.append(sym, lbl);
        b.addEventListener("click", () => sendTap(it.word, b));
        boardEl.appendChild(b);
      }
    }

    function sendTap(word, btn) {
      btn.classList.add("flash");
      setTimeout(() => btn.classList.remove("flash"), 180);
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({
        type: "tap",
        word: word,
        client_ts: Date.now(),    // browser ms epoch (REQUIRED)
        board_id: currentBoardId  // which board it came from (optional, for logging)
      }));
    }

    function connect() {
      ws = new WebSocket(`ws://${location.host}/ws`);
      ws.onopen = () => { reconnectDelay = 500; setStatus(true, "<b>connected</b>"); };
      ws.onclose = () => {
        setStatus(false, "<b>reconnecting…</b>");
        setTimeout(connect, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 2, 5000);
      };
      ws.onerror = () => ws.close();
      ws.onmessage = (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === "vocab_update") {
          currentBoardId = msg.board_id;
          render(msg.items || []);
          const t = new Date().toLocaleTimeString();
          footEl.textContent =
            `board ${String(msg.board_id).slice(0, 8)} · ${(msg.items || []).length} words · updated ${t}`;
        }
      };
    }
    connect();
  </script>
</body>
</html>
